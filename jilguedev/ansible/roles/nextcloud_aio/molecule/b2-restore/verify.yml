---
- name: Verify production backup from B2
  hosts: all
  gather_facts: false
  vars:
    expected_users:
      - cesar
      - nuria
  tasks:
    - name: Read Borg passphrase from repo
      ansible.builtin.slurp:
        src: "{{ borg_passphrase_file }}"
      register: borg_passphrase_b64
      no_log: true

    - name: Set Borg passphrase fact
      ansible.builtin.set_fact:
        borg_passphrase: "{{ borg_passphrase_b64.content | b64decode | trim }}"
      no_log: true

    - name: Check Borg repository integrity
      ansible.builtin.command:
        cmd: "borg check {{ borg_repo_path }}"
      environment:
        BORG_PASSPHRASE: "{{ borg_passphrase }}"
      changed_when: false
      register: borg_check_result

    - name: List Borg archives
      ansible.builtin.command:
        cmd: "borg list {{ borg_repo_path }}"
      environment:
        BORG_PASSPHRASE: "{{ borg_passphrase }}"
      changed_when: false
      register: borg_list_result

    - name: Display available archives
      ansible.builtin.debug:
        msg: "{{ borg_list_result.stdout_lines }}"

    - name: Assert at least one archive exists
      ansible.builtin.assert:
        that:
          - borg_list_result.stdout_lines | length > 0
        fail_msg: "No Borg archives found in the backup repository"

    - name: Clean old database dump if present
      ansible.builtin.file:
        path: /tmp/borg-verify/database-dump.sql
        state: absent

    - name: Extract database dump from the configured archive
      ansible.builtin.command:
        cmd: >-
          borg extract --strip-components 2
          {{ borg_repo_path }}::{{ borg_archive_name }}
          nextcloud_aio_volumes/nextcloud_aio_database_dump/database-dump.sql
        chdir: /tmp/borg-verify
      environment:
        BORG_PASSPHRASE: "{{ borg_passphrase }}"
      changed_when: true

    - name: Check database dump was extracted
      ansible.builtin.stat:
        path: /tmp/borg-verify/database-dump.sql
      register: dump_file

    - name: Assert database dump exists
      ansible.builtin.assert:
        that:
          - dump_file.stat.exists
        fail_msg: "database-dump.sql was not extracted from the backup"

    - name: Verify expected users exist in the database dump
      ansible.builtin.shell:
        cmd: "grep -P '^{{ item }}\\t' /tmp/borg-verify/database-dump.sql"
      loop: "{{ expected_users }}"
      changed_when: false
      register: user_check

    - name: Report success
      ansible.builtin.debug:
        msg: "Backup verification passed: users {{ expected_users | join(', ') }} found in database dump."
