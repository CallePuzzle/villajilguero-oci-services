---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Install borgbackup
      ansible.builtin.apt:
        name: borgbackup
        state: present
        update_cache: true

    - name: Ensure extract directory exists
      ansible.builtin.file:
        path: /tmp/borg-verify
        state: directory
        mode: "0750"
