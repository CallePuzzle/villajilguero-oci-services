---
dependency:
  name: galaxy
  options:
    requirements-file: ../requirements.yml

driver:
  name: default

provisioner:
  name: ansible
  env:
    ANSIBLE_PODMAN_EXECUTABLE: "${MOLECULE_SCENARIO_DIRECTORY}/files/sudo-podman"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    links:
      hosts: inventory.yml

scenario:
  name: aio-functional
  test_sequence:
    - dependency
    - create
    - converge
    - verify
    - destroy
