---
- name: Instalar podman y dependencias
  ansible.builtin.apt:
    name:
      - podman
      - podman-compose
      - slirp4netns
      - uidmap
    state: present
    update_cache: yes

- name: Habilitar linger para el usuario podman
  ansible.builtin.command: loginctl enable-linger {{ podman_user }}
  changed_when: true

- name: Crear directorio del proyecto Nextcloud AIO
  ansible.builtin.file:
    path: "{{ nextcloud_aio_compose_path }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: '0755'

- name: Copiar docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nextcloud_aio_compose_path }}/{{ nextcloud_aio_compose_file }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: '0644'

- name: Asegurar directorio de systemd de usuario
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config/systemd/user"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: '0755'

- name: Crear servicio systemd para podman-compose
  ansible.builtin.template:
    src: podman-compose.service.j2
    dest: "/home/{{ podman_user }}/.config/systemd/user/podman-compose-nextcloud.service"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: '0644'

- name: Recargar systemd de usuario
  ansible.builtin.systemd:
    daemon_reload: yes
    scope: user
  become: yes
  become_user: "{{ podman_user }}"

- name: Iniciar y habilitar el servicio podman-compose-nextcloud
  ansible.builtin.systemd:
    name: podman-compose-nextcloud
    state: started
    enabled: yes
    scope: user
  become: yes
  become_user: "{{ podman_user }}"

- name: Esperar a que la interfaz AIO esté disponible
  ansible.builtin.uri:
    url: "https://localhost:8080"
    status_code:
      - 200
      - 301
      - 302
    validate_certs: no
  register: result
  until: result.status is defined
  retries: 30
  delay: 10
  become: yes
  become_user: "{{ podman_user }}"
  ignore_errors: yes
