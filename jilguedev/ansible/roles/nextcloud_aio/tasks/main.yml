---
- name: Get user UID
  ansible.builtin.command: id -u {{ docker_user }}
  register: docker_uid_result
  changed_when: false

- name: Define rootless Docker socket path
  ansible.builtin.set_fact:
    docker_uid: "{{ docker_uid_result.stdout }}"
    docker_socket_path: "/run/user/{{ docker_uid_result.stdout }}/docker.sock"

- name: Install Docker dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
  become: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add official Docker GPG key
  ansible.builtin.shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  become: true

- name: Add Docker repository
  ansible.builtin.shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  args:
    creates: /etc/apt/sources.list.d/docker.list
  become: true

- name: Install Docker CE and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-ce-rootless-extras
      - slirp4netns
      - uidmap
    state: present
    update_cache: yes
  become: true

- name: Configure sysctl for rootless Docker
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
    reload: yes
  loop:
    - { name: "kernel.unprivileged_userns_clone", value: "1" }
    - { name: "net.ipv4.ip_unprivileged_port_start", value: "0" }
  become: true

- name: Check if linger is enabled
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ docker_user }}"
  register: linger_stat
  changed_when: false

- name: Enable linger for user
  ansible.builtin.command: loginctl enable-linger {{ docker_user }}
  when: not linger_stat.stat.exists
  become: true

- name: Initialize rootless Docker
  ansible.builtin.command: dockerd-rootless-setuptool.sh install
  args:
    creates: "/home/{{ docker_user }}/.config/systemd/user/docker.service"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ docker_uid }}"
    PATH: "{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"

- name: Ensure Docker config directory exists
  ansible.builtin.file:
    path: "/home/{{ docker_user }}/.config/docker"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Configure Docker daemon.json for local log driver
  ansible.builtin.copy:
    dest: "/home/{{ docker_user }}/.config/docker/daemon.json"
    content: |
      {
        "log-driver": "local",
        "live-restore": false
      }
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  register: docker_daemon_json

- name: Ensure rootless Docker user service is enabled
  ansible.builtin.systemd:
    name: docker
    enabled: yes
    scope: user

- name: Restart rootless Docker to apply daemon.json changes
  ansible.builtin.systemd:
    name: docker
    state: restarted
    scope: user
  when: docker_daemon_json.changed | bool

- name: Hardening - install and configure UFW
  when: nextcloud_aio_enable_ufw | bool
  block:
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: yes
      become: true

    - name: Reset UFW to ensure clean rule state
      community.general.ufw:
        state: reset
      become: true

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: 22
        proto: tcp
      become: true

    - name: Allow HTTP through UFW
      community.general.ufw:
        rule: allow
        port: 80
        proto: tcp
      become: true

    - name: Allow HTTPS through UFW
      community.general.ufw:
        rule: allow
        port: 443
        proto: tcp
      become: true

    - name: Deny AIO admin port 8080 from public
      community.general.ufw:
        rule: deny
        port: 8080
        proto: tcp
      become: true

    - name: Enable UFW with default deny policy
      community.general.ufw:
        state: enabled
        policy: deny
      become: true

- name: Hardening - install and configure fail2ban
  when: nextcloud_aio_enable_fail2ban | bool
  block:
    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present
        update_cache: yes
      become: true

    - name: Configure fail2ban jail for SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 3600
          findtime = 600
          maxretry = 5

          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          backend = systemd
        mode: "0644"
      become: true

    - name: Restart and enable fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
        enabled: yes
      become: true

- name: Hardening - install and configure unattended-upgrades
  when: nextcloud_aio_enable_unattended_upgrades | bool
  block:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        update_cache: yes
      become: true

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"
      become: true

- name: Create Nextcloud AIO project directory
  ansible.builtin.file:
    path: "{{ nextcloud_aio_compose_path }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Copy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ nextcloud_aio_compose_path }}/Caddyfile"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"

- name: Copy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nextcloud_aio_compose_path }}/{{ nextcloud_aio_compose_file }}"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"

- name: Ensure user systemd directory
  ansible.builtin.file:
    path: "/home/{{ docker_user }}/.config/systemd/user"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create systemd service for docker compose
  ansible.builtin.template:
    src: docker-compose.service.j2
    dest: "/home/{{ docker_user }}/.config/systemd/user/docker-compose-nextcloud.service"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"

- name: Reload user systemd
  ansible.builtin.systemd:
    daemon_reload: yes
    scope: user

- name: Start and enable docker-compose-nextcloud service
  ansible.builtin.systemd:
    name: docker-compose-nextcloud
    state: started
    enabled: yes
    scope: user

- name: Create Nextcloud AIO backup systemd service
  ansible.builtin.template:
    src: nextcloud-aio-backup.service.j2
    dest: "/home/{{ docker_user }}/.config/systemd/user/nextcloud-aio-backup.service"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  when: nextcloud_aio_backup_enabled | bool

- name: Create Nextcloud AIO backup systemd timer
  ansible.builtin.template:
    src: nextcloud-aio-backup.timer.j2
    dest: "/home/{{ docker_user }}/.config/systemd/user/nextcloud-aio-backup.timer"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  when: nextcloud_aio_backup_enabled | bool

- name: Reload user systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes
    scope: user

- name: Enable and start backup timer
  ansible.builtin.systemd:
    name: nextcloud-aio-backup.timer
    state: started
    enabled: yes
    scope: user
  when: nextcloud_aio_backup_enabled | bool

- name: Wait for AIO interface to be available
  ansible.builtin.uri:
    url: "https://localhost:8080"
    status_code:
      - 200
      - 301
      - 302
    validate_certs: no
  register: result
  until: result.status is defined
  retries: 30
  delay: 10
  ignore_errors: true
