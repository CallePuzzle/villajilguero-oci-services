---
- name: Get user UID
  ansible.builtin.command: id -u {{ docker_user }}
  register: docker_uid_result
  changed_when: false

- name: Define rootless Docker socket path
  ansible.builtin.set_fact:
    docker_uid: "{{ docker_uid_result.stdout }}"
    docker_socket_path: "/run/user/{{ docker_uid_result.stdout }}/docker.sock"

- name: Install Docker dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
  become: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add official Docker GPG key
  ansible.builtin.shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  become: true

- name: Add Docker repository
  ansible.builtin.shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  args:
    creates: /etc/apt/sources.list.d/docker.list
  become: true

- name: Install Docker CE and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-ce-rootless-extras
      - slirp4netns
      - uidmap
    state: present
    update_cache: yes
  become: true

- name: Configure sysctl for rootless Docker
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
    reload: yes
  loop:
    - { name: "kernel.unprivileged_userns_clone", value: "1" }
    - { name: "net.ipv4.ip_unprivileged_port_start", value: "0" }
  become: true

- name: Enable linger for user
  ansible.builtin.command: loginctl enable-linger {{ docker_user }}
  changed_when: true
  become: true

- name: Initialize rootless Docker
  ansible.builtin.command: dockerd-rootless-setuptool.sh install
  args:
    creates: "/home/{{ docker_user }}/.config/docker/daemon.json"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ docker_uid }}"
    PATH: "{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"
  become: true
  become_user: "{{ docker_user }}"

- name: Create Nextcloud AIO project directory
  ansible.builtin.file:
    path: "{{ nextcloud_aio_compose_path }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Copy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nextcloud_aio_compose_path }}/{{ nextcloud_aio_compose_file }}"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"

- name: Ensure user systemd directory
  ansible.builtin.file:
    path: "/home/{{ docker_user }}/.config/systemd/user"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create systemd service for docker compose
  ansible.builtin.template:
    src: docker-compose.service.j2
    dest: "/home/{{ docker_user }}/.config/systemd/user/docker-compose-nextcloud.service"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"

- name: Reload user systemd
  ansible.builtin.systemd:
    daemon_reload: yes
    scope: user
  become: true
  become_user: "{{ docker_user }}"

- name: Start and enable docker-compose-nextcloud service
  ansible.builtin.systemd:
    name: docker-compose-nextcloud
    state: started
    enabled: yes
    scope: user
  become: true
  become_user: "{{ docker_user }}"

- name: Wait for AIO interface to be available
  ansible.builtin.uri:
    url: "https://localhost:8080"
    status_code:
      - 200
      - 301
      - 302
    validate_certs: no
  register: result
  until: result.status is defined
  retries: 30
  delay: 10
  ignore_errors: true
  become: true
  become_user: "{{ docker_user }}"
