---
# Host base: rootless Docker, OS hardening and the Backblaze B2 CLI.
# Everything here is host-level and app-agnostic; app roles (nextcloud_aio,
# wallabag, ...) run after this one and deploy on top of it.

- name: Get docker_host_user UID
  ansible.builtin.command: id -u {{ docker_host_user }}
  register: docker_host_uid_result
  changed_when: false

- name: Define rootless Docker socket path
  ansible.builtin.set_fact:
    docker_host_uid: "{{ docker_host_uid_result.stdout }}"
    docker_host_socket_path: "/run/user/{{ docker_host_uid_result.stdout }}/docker.sock"

- name: Install Docker dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
  become: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    # Must stay world-readable/traversable: apt's _apt sandbox user needs to
    # read the GPG keyring here to verify the Docker repo's InRelease signature.
    mode: "0755"
  become: true

- name: Add official Docker GPG key
  ansible.builtin.shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  become: true

- name: Add Docker repository
  ansible.builtin.shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  args:
    creates: /etc/apt/sources.list.d/docker.list
  become: true

- name: Install Docker CE and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-ce-rootless-extras
      - slirp4netns
      - uidmap
    state: present
    update_cache: yes
  become: true

- name: Configure sysctl for rootless Docker
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
    reload: yes
  loop:
    - { name: "kernel.unprivileged_userns_clone", value: "1" }
    - { name: "net.ipv4.ip_unprivileged_port_start", value: "0" }
  become: true

- name: Check if linger is enabled
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ docker_host_user }}"
  register: linger_stat
  changed_when: false

- name: Enable linger for user
  ansible.builtin.command: loginctl enable-linger {{ docker_host_user }}
  when: not linger_stat.stat.exists
  become: true

- name: Initialize rootless Docker
  ansible.builtin.command: dockerd-rootless-setuptool.sh install
  args:
    creates: "/home/{{ docker_host_user }}/.config/systemd/user/docker.service"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ docker_host_uid }}"
    PATH: "{{ ansible_facts.env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"

- name: Install fuse-overlayfs
  ansible.builtin.apt:
    name: fuse-overlayfs
    state: present
  become: true
  when: docker_host_storage_driver == "fuse-overlayfs"

- name: Ensure Docker config directory exists
  ansible.builtin.file:
    path: "/home/{{ docker_host_user }}/.config/docker"
    state: directory
    owner: "{{ docker_host_user }}"
    group: "{{ docker_host_user }}"
    mode: "0750"

- name: Configure Docker daemon.json for local log driver
  ansible.builtin.copy:
    dest: "/home/{{ docker_host_user }}/.config/docker/daemon.json"
    content: |
      {
        "log-driver": "local",
        "live-restore": false{% if docker_host_storage_driver | length > 0 %},
        "storage-driver": "{{ docker_host_storage_driver }}"{% endif %}
      }
    owner: "{{ docker_host_user }}"
    group: "{{ docker_host_user }}"
    mode: "0640"
  register: docker_daemon_json

- name: Ensure rootless Docker user service is enabled
  ansible.builtin.systemd:
    name: docker
    enabled: yes
    scope: user

- name: Restart rootless Docker to apply daemon.json changes
  ansible.builtin.systemd:
    name: docker
    state: restarted
    scope: user
  when: docker_daemon_json.changed | bool

- name: Hardening - install and configure UFW
  when: docker_host_enable_ufw | bool
  block:
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: yes
      become: true

    - name: Reset UFW to ensure clean rule state
      community.general.ufw:
        state: reset
      become: true

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: 22
        proto: tcp
      become: true

    - name: Allow HTTP through UFW
      community.general.ufw:
        rule: allow
        port: 80
        proto: tcp
      become: true

    - name: Allow HTTPS through UFW
      community.general.ufw:
        rule: allow
        port: 443
        proto: tcp
      become: true

    - name: Deny AIO admin port 8080 from public
      community.general.ufw:
        rule: deny
        port: 8080
        proto: tcp
      become: true

    - name: Enable UFW with default deny policy
      community.general.ufw:
        state: enabled
        policy: deny
      become: true

- name: Hardening - install and configure fail2ban
  when: docker_host_enable_fail2ban | bool
  block:
    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present
        update_cache: yes
      become: true

    - name: Configure fail2ban jail for SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 3600
          findtime = 600
          maxretry = 5

          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          backend = systemd
        mode: "0640"
      become: true

    - name: Restart and enable fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
        enabled: yes
      become: true

- name: Hardening - install and configure unattended-upgrades
  when: docker_host_enable_unattended_upgrades | bool
  block:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        update_cache: yes
      become: true

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0640"
      become: true

- name: Gather architecture fact (in case the play skipped fact gathering)
  ansible.builtin.setup:
    filter: ansible_architecture
  when:
    - docker_host_b2_cli_enabled | bool
    - ansible_facts.architecture is not defined

- name: Install Backblaze B2 CLI
  ansible.builtin.get_url:
    url: "https://github.com/Backblaze/B2_Command_Line_Tool/releases/download/v{{ docker_host_b2_version }}/b2-linux{{ '-aarch64' if ansible_facts.architecture == 'aarch64' else '' }}"
    dest: /usr/local/bin/b2
    mode: "0755"
  become: true
  when: docker_host_b2_cli_enabled | bool
