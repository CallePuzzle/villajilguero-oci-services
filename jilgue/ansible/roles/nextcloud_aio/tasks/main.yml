---
# Nextcloud AIO app deployment. Depends on the docker_host role having run
# first in the same play (rootless Docker daemon + B2 CLI already installed;
# docker_host_user shared), and on the caddy role right after it (sites
# directory + proxy container for the site snippet written here).

- name: Get docker_host_user UID
  ansible.builtin.command: id -u {{ docker_host_user }}
  register: docker_host_uid_result
  changed_when: false

- name: Define rootless Docker socket path
  ansible.builtin.set_fact:
    docker_host_uid: "{{ docker_host_uid_result.stdout }}"
    docker_host_socket_path: "/run/user/{{ docker_host_uid_result.stdout }}/docker.sock"

- name: Create Nextcloud AIO project directory
  ansible.builtin.file:
    path: "{{ nextcloud_aio_compose_path }}"
    state: directory
    owner: "{{ docker_host_user }}"
    group: "{{ docker_host_user }}"
    mode: "0750"

- name: Create local backup directory
  ansible.builtin.file:
    path: "{{ nextcloud_aio_backup_dir }}"
    state: directory
    owner: "{{ docker_host_user }}"
    group: "{{ docker_host_user }}"
    mode: "0750"
  when: nextcloud_aio_backup_dir | length > 0

# Site snippet for the caddy role's reverse proxy (caddy_sites_path is
# exported by that role; the default here keeps this role runnable
# standalone). Caddy imports it via the base Caddyfile.
- name: Write the Nextcloud site snippet for Caddy
  ansible.builtin.template:
    src: nextcloud.caddy.j2
    dest: "{{ caddy_sites_path }}/nextcloud.caddy"
    owner: "{{ docker_host_user }}"
    group: "{{ docker_host_user }}"
    mode: "0640"
  register: nextcloud_aio_caddy_site

- name: Copy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nextcloud_aio_compose_path }}/{{ nextcloud_aio_compose_file }}"
    owner: "{{ docker_host_user }}"
    group: "{{ docker_host_user }}"
    mode: "0640"
  register: nextcloud_aio_compose_file

- name: Ensure user systemd directory
  ansible.builtin.file:
    path: "/home/{{ docker_host_user }}/.config/systemd/user"
    state: directory
    owner: "{{ docker_host_user }}"
    group: "{{ docker_host_user }}"
    mode: "0750"

- name: Create systemd service for docker compose
  ansible.builtin.template:
    src: docker-compose.service.j2
    dest: "/home/{{ docker_host_user }}/.config/systemd/user/docker-compose-nextcloud.service"
    owner: "{{ docker_host_user }}"
    group: "{{ docker_host_user }}"
    mode: "0640"

- name: Reload user systemd
  ansible.builtin.systemd:
    daemon_reload: yes
    scope: user

- name: Start and enable docker-compose-nextcloud service
  ansible.builtin.systemd:
    name: docker-compose-nextcloud
    state: started
    enabled: yes
    scope: user

# The systemd unit above only starts docker-compose-nextcloud if it wasn't
# running; it won't pick up changes to docker-compose.yml on its own
# (e.g. nextcloud_aio_mastercontainer_ip_binding or nextcloud_aio_apache_ip_binding
# changed after the initial install), so re-apply explicitly when it changed.
- name: Apply docker-compose.yml changes to running containers
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ nextcloud_aio_compose_path }}"
  environment:
    DOCKER_HOST: "unix://{{ docker_host_socket_path }}"
    PATH: "{{ ansible_facts.env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"
  when: nextcloud_aio_compose_file.changed

# Caddy only reads its site snippets at startup, and they're bind-mounted
# files rather than part of the compose service definition, so "docker
# compose up -d" above won't make it reload on its own.
- name: Restart Caddy to apply the site snippet changes
  ansible.builtin.command:
    cmd: docker restart {{ caddy_container_name }}
  environment:
    DOCKER_HOST: "unix://{{ docker_host_socket_path }}"
    PATH: "{{ ansible_facts.env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"
  when: nextcloud_aio_caddy_site.changed

# Obsolete since #38: the base Caddyfile moved to the caddy role's own
# compose project; this role now only ships the site snippet above.
- name: Remove the obsolete Caddyfile from the AIO compose project
  ansible.builtin.file:
    path: "{{ nextcloud_aio_compose_path }}/Caddyfile"
    state: absent

- name: Create Nextcloud AIO backup systemd service
  ansible.builtin.template:
    src: nextcloud-aio-backup.service.j2
    dest: "/home/{{ docker_host_user }}/.config/systemd/user/nextcloud-aio-backup.service"
    owner: "{{ docker_host_user }}"
    group: "{{ docker_host_user }}"
    mode: "0640"
  when: nextcloud_aio_backup_enabled | bool

- name: Create Nextcloud AIO backup systemd timer
  ansible.builtin.template:
    src: nextcloud-aio-backup.timer.j2
    dest: "/home/{{ docker_host_user }}/.config/systemd/user/nextcloud-aio-backup.timer"
    owner: "{{ docker_host_user }}"
    group: "{{ docker_host_user }}"
    mode: "0640"
  when: nextcloud_aio_backup_enabled | bool

- name: Reload user systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes
    scope: user

- name: Enable and start backup timer
  ansible.builtin.systemd:
    name: nextcloud-aio-backup.timer
    state: started
    enabled: yes
    scope: user
  when: nextcloud_aio_backup_enabled | bool

- name: Schedule daily sync of Borg backup to Backblaze B2
  ansible.builtin.cron:
    name: Sync Nextcloud AIO Borg backup to Backblaze B2
    user: "{{ docker_host_user }}"
    hour: "{{ nextcloud_aio_b2_sync_time.split(':')[0] }}"
    minute: "{{ nextcloud_aio_b2_sync_time.split(':')[1] }}"
    job: >-
      /usr/local/bin/b2 sync {{ nextcloud_aio_backup_dir }} {{ nextcloud_aio_b2_bucket }}
      >> /home/{{ docker_host_user }}/nextcloud-aio-b2-sync.log 2>&1
  become: true
  when: nextcloud_aio_b2_sync_enabled | bool

- name: Wait for AIO interface to be available
  ansible.builtin.uri:
    url: "https://localhost:8080"
    status_code:
      - 200
      - 301
      - 302
    validate_certs: no
  register: result
  until: result.status is defined
  retries: 30
  delay: 10
  ignore_errors: true
