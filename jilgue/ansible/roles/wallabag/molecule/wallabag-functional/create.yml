---
- name: Create container for the Wallabag functional test
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create test container (rootful podman, needed for nested rootless Docker)
      containers.podman.podman_container:
        name: "{{ hostvars[item].ansible_host }}"
        image: "{{ hostvars[item].container_image }}"
        executable: "{{ playbook_dir }}/files/sudo-podman"
        systemd: always
        privileged: true
        # Podman's default pids-limit (2048) is shared across the whole
        # nested stack (Docker daemon + caddy + wallabag). It's fine at
        # steady state but bursts (first boot of the app, docker exec)
        # push past it, causing random fork()/clone() EAGAIN failures.
        # Can't be changed on a running container (crun refuses resource
        # updates on --privileged containers using a BPF device program),
        # so it must be set at creation time.
        pids_limit: "-1"
        device:
          - /dev/fuse
        state: started
        detach: true
      loop: "{{ groups['all'] }}"

    - name: Wait for containers to be ready
      ansible.builtin.wait_for_connection:
        timeout: 300
      delegate_to: "{{ hostvars[item].ansible_host }}"
      loop: "{{ groups['all'] }}"
