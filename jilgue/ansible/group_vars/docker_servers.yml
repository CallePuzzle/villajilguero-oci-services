---
docker_host_user: ubuntu
caddy_compose_path: /home/ubuntu/caddy
nextcloud_aio_compose_path: /home/ubuntu/nextcloud-aio
nextcloud_aio_compose_file: docker-compose.yml
# Wallabag is disabled by default; set wallabag_enabled: true to deploy it
# (all its role tasks are guarded, like the AIO backup tasks).
wallabag_enabled: false
wallabag_compose_path: /home/ubuntu/wallabag
wallabag_compose_file: docker-compose.yml
